name: publish
# First PyPI publish of omind (#267), and every release after it.
#
# Trusted publishing (OIDC): PyPI trusts THIS workflow in THIS repo, so there is
# no API token to mint, store, leak or rotate. One-time setup on pypi.org, by
# the account that will own the project (see BACKLOG.md "PyPI Publish Setup"):
#   Publishing -> Add a pending publisher -> GitHub
#     owner: CryptoJones   repository: omind
#     workflow: publish.yml   environment: pypi
# Until that exists the publish step fails closed with "invalid-publisher";
# nothing is uploaded and nothing else in the repo is affected.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; do not upload
        type: boolean
        default: true

# Least privilege: the default is read-only; only the publish job can mint an
# OIDC token, and only inside the `pypi` environment.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: A release tag must match the packaged version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match pyproject version $version"
            exit 1
          fi
      # uv build: the same command test.yml's wheel job runs on every PR, so
      # the build path that publishes is the one CI exercises.
      - run: uv build
      - name: Metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Hand the artifacts to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/omind/
    permissions:
      id-token: write # the OIDC token PyPI exchanges for an upload credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
