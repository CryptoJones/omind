name: publish
# Uploads omind to PyPI on every published GitHub release (#267).
#
# Auth: a PyPI API token stored as the `PYPI_API_TOKEN` secret of the `pypi`
# environment (Settings -> Environments -> pypi). Only the publish job runs in
# that environment, so only it can read the token. Rotate the token on pypi.org
# and re-set the secret; nothing else references it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; do not upload
        type: boolean
        default: true

# Least privilege: read-only everywhere; the token is scoped to the `pypi`
# environment, which only the publish job enters.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: A release tag must match the packaged version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release tag $TAG does not match pyproject version $version"
            exit 1
          fi
      # uv build: the same command test.yml's wheel job runs on every PR, so
      # the build path that publishes is the one CI exercises.
      - run: uv build
      - name: Metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - name: Hand the artifacts to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/omind/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations need trusted publishing (OIDC); token uploads skip them.
          attestations: false
